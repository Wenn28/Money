name: saham

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-saham}
      POSTGRES_USER: ${PG_USER:-saham}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-saham_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-saham} -d ${PG_DB:-saham}"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: saham
      CLICKHOUSE_USER: ${CH_USER:-saham}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-saham_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: Asia/Jakarta
    volumes:
      - chdata:/var/lib/clickhouse
      - ./db/clickhouse:/docker-entrypoint-initdb.d:ro
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-saham_dev}", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD:-saham_dev} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      TZ: Asia/Jakarta
      PG_DSN: postgresql://${PG_USER:-saham}:${PG_PASSWORD:-saham_dev}@postgres:5432/${PG_DB:-saham}
      CH_HOST: clickhouse
      CH_PORT: 8123
      CH_USER: ${CH_USER:-saham}
      CH_PASSWORD: ${CH_PASSWORD:-saham_dev}
      VALKEY_URL: redis://:${VALKEY_PASSWORD:-saham_dev}@valkey:6379/0
      FEED_ADAPTER: ${FEED_ADAPTER:-simulated}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-ganti_di_env_lokal}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      valkey: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  chdata:
  valkeydata:
