name: data

on:
  schedule:
    - cron: "*/5 2-8 * * 1-5"  # snapshot tiap ~5 menit, 09:00-15:59 WIB (UTC+7). GitHub bisa menunda jadwal beberapa menit.
    - cron: "30 9 * * 1-5"     # baseline dan Profil Volume, 16:30 WIB sesudah penutupan
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  jalankan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Baseline dan profil (sesudah tutup)
        if: github.event.schedule == '30 9 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          uv run --no-project --python 3.12 tools/refresh_baseline.py
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/baseline.json data/profil.json
          git commit -m "data: baseline dan profil volume" || echo "tidak ada perubahan"
          git push

      - name: Snapshot RVOL
        run: uv run --no-project --python 3.12 tools/fetch_snapshot.py

      # Perlu secret FIREBASE_SERVICE_ACCOUNT (isi JSON service account Firebase).
      - name: Kirim ke Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: uv run --no-project --python 3.12 --with firebase-admin tools/publish_firestore.py
